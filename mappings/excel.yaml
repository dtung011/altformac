# Windows Alt sequences -> how to run them in Excel for Mac.
# ALWAYS quote `keys`: a bare `N` or `Y` parses as a YAML boolean.
#
# Source of the sequences: https://www.excelconsultant.co.uk/excel-spreadsheet-resources-shortcut-keys/
# Only Alt sequences are listed (Ctrl/F-key shortcuts already work on Mac). Left out on purpose:
# Format Cells dialog letters, VBA/Power BI entries, Quick Access Toolbar digits, contextual PivotTable
# tab sequences (J T ...), Developer tab (L) and File page (F), which Excel for Mac does not have.
#
# Steps were verified against Excel for Mac 16.104 with `swift run mapping-check`
# (menu paths and ribbon controls exist in docs/dumps, AppleScript compiles).
# Executor order = fastest and most stable first: shortcut -> menu -> applescript -> ribbon.
# `ribbon:` is the path shown in the HUD: one segment per key typed (ribbon groups are skipped).
# Ribbon `role` separates controls that share a title; `menu: true` opens a dropdown (AXShowMenu).

# ---- Ribbon tabs (Alt, then the tab letter). Runs after a short pause, like the Windows KeyTip. ----

- keys: "H"
  label: Home tab
  ribbon: Home
  run:
    - ribbon: { tab: Home, control: "" }

- keys: "N"
  label: Insert tab
  ribbon: Insert
  run:
    - ribbon: { tab: Insert, control: "" }

- keys: "P"
  label: Page Layout tab
  ribbon: Page Layout
  run:
    - ribbon: { tab: Page Layout, control: "" }

- keys: "M"
  label: Formulas tab
  ribbon: Formulas
  run:
    - ribbon: { tab: Formulas, control: "" }

- keys: "A"
  label: Data tab
  ribbon: Data
  run:
    - ribbon: { tab: Data, control: "" }

- keys: "R"
  label: Review tab
  ribbon: Review
  run:
    - ribbon: { tab: Review, control: "" }

- keys: "W"
  label: View tab
  ribbon: View
  run:
    - ribbon: { tab: View, control: "" }

# ---- Home ----

- keys: "H W"
  label: Wrap text
  ribbon: Home > Wrap Text
  run:
    - ribbon: { tab: Home, control: Wrap Text, role: menubutton }

- keys: "H A C"
  label: Center align
  ribbon: Home > Alignment > Center
  run:
    - ribbon: { tab: Home, control: Center, role: checkbox }

- keys: "H A L"
  label: Align left
  ribbon: Home > Alignment > Align Left
  run:
