- keys: "H O I"
  label: AutoFit column width
  ribbon: Home > Format > AutoFit Column Width
  run:
    - menu: [Format, Column, AutoFit Selection]

- keys: "O D"
  label: Conditional Formatting dialog
  ribbon: Format > Conditional Formatting
  run:
    - menu: [Format, Conditional Formatting...]
    - ribbon: { tab: Home, control: Conditional Formatting, role: menubutton, menu: true }

# ---- Insert ----

- keys: "N V"
  label: Insert PivotTable
  ribbon: Insert > PivotTable
  run:
