# Windows Alt sequences -> how to run them in Word for Mac. See excel.yaml for the conventions.
# ALWAYS quote `keys`. Sequences are the Windows KeyTips for Word; only commands that exist in
# Word for Mac 16.104 are listed. Every step was verified with `swift run mapping-check mappings/word.yaml`.
# Executor order = fastest and most stable first: shortcut -> menu -> applescript -> ribbon.
# `menu: true` opens a dropdown (AXShowMenu): it never presses the control.

- keys: "H"
  label: "Home tab"
  ribbon: "Home"
  run:
    - ribbon: { tab: "Home", control: "" }

- keys: "N"
  label: "Insert tab"
  ribbon: "Insert"
  run:
    - ribbon: { tab: "Insert", control: "" }

